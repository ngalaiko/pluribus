[package]
name = "pluribus-plugin-github"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lib]
crate-type = ["cdylib"]
[dependencies]
url.workspace = true
futures-util.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
wit-bindgen.workspace = true

rsa = { version = "0.9", default-features = false, features = ["pem"] }
sha2_10 = { package = "sha2", version = "0.10", features = ["oid"] }
hmac = "0.12"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
pluribus-runtime-wasm = { path = "../../crates/pluribus-runtime-wasm" }
pluribus-plugin-package = { path = "../../crates/pluribus-plugin-package" }
pluribus-store-sqlite = { path = "../../crates/pluribus-store-sqlite" }
axum = "0.8"
ring = "0.17"
rustix.workspace = true
tokio.workspace = true
reqwest.workspace = true
pluribus-core = { path = "../../crates/pluribus-core" }
pluribus-host-stream = { path = "../../crates/pluribus-host-stream" }
tempfile.workspace = true
async-trait.workspace = true
