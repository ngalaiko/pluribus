abi = "pluribus:plugin@3.0.0"
manifest_version = 1
id = "dev.pluribus.cli"
name = "CLI"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"

[components.main]
connector = { provider = "cli", reply_component = "main" }
world = "pluribus:plugin/plugin@3.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
config_schema = "config.schema.json"
imports = ["pluribus:plugin/runtime@3.0.0", "pluribus:plugin/socket@3.0.0", "pluribus:plugin/state@3.0.0", "wasi:clocks/monotonic-clock@0.3.0"]
subscribes = []
emits = ["observation.received", "capability.completed", "capability.failed"]

[[components.main.requested_capabilities]]
name = "host.stream"
required = true
reason = "The granted endpoint is the terminal a person types into and reads replies from."
constraints = { unrestricted = true }

[[components.main.provides]]
capability = "cli.reply"
description = "Answer the person at the terminal with text."
arguments_schema = "schemas/reply.arguments.json"
result_schema = "schemas/reply.result.json"
constraints_schema = "schemas/reply.constraints.json"
idempotency = "non-idempotent"
constraint_bindings = { conversation_ids = { parts = [{ pointer = "/conversationId" }] } }
