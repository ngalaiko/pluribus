abi = "pluribus:plugin@1.0.0"
manifest_version = 1
id = "dev.pluribus.openrouter"
name = "OpenRouter"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"


[components.main]
config_pointer = ""
config_schema = "config.schema.json"
world = "pluribus:plugin/plugin@1.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
imports = [
  "pluribus:plugin/blobs@1.0.0",
  "pluribus:plugin/events@1.0.0",
  "pluribus:plugin/http@1.0.0",
  "pluribus:plugin/reader@1.0.0",
]
emits = ["model.stream", "model.completed", "model.failed"]
[components.main.model_provider]
models_pointer = "/models"

[[credentials]]
components = ["main"]
id = "api-key"
display_name = "OpenRouter API key"
description = "Spend one OpenRouter key's credit on the configured models."
config_pointer = "/credential"
input_schema = "schemas/credential.input.json"
flow_schema = "pluribus:credential/static-http@1"
flow = "flows/api-key.json"

[[components.main.requested_capabilities]]
name = "net.http"
required = true
reason = "Call the OpenRouter chat-completions endpoint."
constraints = { origins = ["https://openrouter.ai"], methods = ["POST"] }
