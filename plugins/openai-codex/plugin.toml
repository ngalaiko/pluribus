abi = "pluribus:plugin@3.0.0"
manifest_version = 1
id = "dev.pluribus.openai-codex"
name = "OpenAI Codex subscription"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"


[defaults]
models = ["gpt-5.6-luna"]
timeout_ms = 300000

[components.main]
config_schema = "config.schema.json"
world = "pluribus:plugin/plugin@3.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
imports = ["pluribus:plugin/runtime@3.0.0", "wasi:clocks/monotonic-clock@0.3.0", "wasi:clocks/system-clock@0.3.0", "pluribus:plugin/blobs@3.0.0", "pluribus:plugin/events@3.0.0", "wasi:http/types@0.3.0", "wasi:http/client@0.3.0", "pluribus:plugin/credentials@3.0.0"]
subscribes = ["credential.enrollment.requested", "timer.fired"]
emits = ["model.stream", "model.completed", "model.failed", "credential.enrollment.started", "timer.set"]
[components.main.model_provider]
models_pointer = "/models"

[[credentials]]
components = ["main"]
id = "subscription"
access = true
display_name = "Codex subscription"
description = "Sign in to a ChatGPT subscription using device authorization."
input_schema = "schemas/credential.input.json"
flow_schema = "pluribus:credential/plugin@1"
flow = "flows/subscription.json"

[[components.main.requested_capabilities]]
name = "host.http"
required = true
reason = "Complete device authorization, refresh the subscription token, and call the ChatGPT Codex Responses endpoint."
constraints = { origins = ["https://auth.openai.com", "https://chatgpt.com"], methods = ["POST"] }
