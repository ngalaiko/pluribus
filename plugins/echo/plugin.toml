abi = "pluribus:plugin@3.0.0"
manifest_version = 1
id = "dev.pluribus.echo"
name = "Echo"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"

[component]
config_schema = "config.schema.json"
world = "pluribus:plugin/plugin@3.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
imports = ["pluribus:plugin/runtime@3.0.0", "pluribus:plugin/events@3.0.0", "pluribus:plugin/state@3.0.0"]
subscribes = ["http.request.received"]
emits = ["capability.output", "capability.completed", "capability.failed", "http.response.requested"]

[[component.provides]]
capability = "system.echo"
description = "Returns the supplied JSON object."
arguments_schema = "schemas/echo.arguments.json"
result_schema = "schemas/echo.result.json"
constraints_schema = "schemas/echo.constraints.json"
idempotency = "inherent"
