abi = "pluribus:plugin@2.0.0"
manifest_version = 1
id = "dev.pluribus.http"
name = "HTTP"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"

[components.listen]
world = "pluribus:plugin/plugin@2.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
config_schema = "config.schema.json"
imports = ["pluribus:plugin/events@2.0.0", "pluribus:plugin/runtime@2.0.0", "pluribus:plugin/socket@2.0.0", "pluribus:plugin/state@2.0.0", "wasi:clocks/monotonic-clock@0.3.0"]
subscribes = ["http.response.requested"]
emits = ["http.request.received"]

[[components.listen.requested_capabilities]]
name = "host.stream"
required = true
reason = "Connect to the configured native service"
constraints = { unrestricted = true }
