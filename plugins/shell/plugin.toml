abi = "pluribus:plugin@3.0.0"
manifest_version = 1
id = "dev.pluribus.shell"
name = "Shell"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"


[components.main]
config_schema = "config.schema.json"
world = "pluribus:plugin/plugin@3.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
imports = ["pluribus:plugin/runtime@3.0.0", "pluribus:plugin/credentials@3.0.0", "pluribus:plugin/socket@3.0.0", "pluribus:plugin/blobs@3.0.0", "wasi:clocks/monotonic-clock@0.3.0"]
emits = ["capability.completed", "capability.failed"]
[[components.main.provides]]
capability = "shell.execute"
description = "Runs /bin/sh in the workspace; do not retry irreversible commands. Ready attachments are listed in the capability event's top-level `attachments` context. Use `pluribus-shell-cli attachment SHA256_DIGEST` to read one, `pluribus-shell-cli upload PATH [MEDIA_TYPE]` to upload a file, and `pluribus-shell-cli secret BINDING` for a granted export. Upload stdout is BlobRef JSON. Help: `pluribus-shell-cli --help`. Keep secrets out of logs."
arguments_schema = "schemas/execute.arguments.json"
result_schema = "schemas/execute.result.json"
constraints_schema = "schemas/execute.constraints.json"
idempotency = "non-idempotent"

[[components.main.requested_capabilities]]
name = "host.stream"
required = true
reason = "The granted endpoint runs unrestricted shell commands with the workspace account's full authority."
constraints = { unrestricted = true }
