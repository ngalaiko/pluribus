abi = "pluribus:plugin@3.0.0"
manifest_version = 1
id = "dev.pluribus.memory"
name = "Memory"
config_schema = "config.schema.json"
license = "MIT OR Apache-2.0"


[components.main]
config_schema = "config.schema.json"
world = "pluribus:plugin/plugin@3.0.0"
component = "plugin.wasm"
digest = "sha256:dev"
imports = ["pluribus:plugin/runtime@3.0.0", "pluribus:plugin/events@3.0.0", "pluribus:plugin/state@3.0.0"]
subscribes = ["memory.remembered", "memory.superseded", "memory.forgotten"]
rebuilds = ["memory.remembered", "memory.superseded", "memory.forgotten"]
emits = ["memory.remembered", "memory.superseded", "memory.forgotten", "capability.completed", "capability.failed"]
[[components.main.provides]]
capability = "memory.remember"
description = "Retain one sourced fact, preference, belief, goal, or reusable procedure. Recall related records first; supersede corrections instead of duplicating them. Include task keywords, executor/workspace context for environment lessons, and authoritative template paths for workflows. Label generalizations inferred; keep transient progress in working state."
arguments_schema = "schemas/remember.arguments.json"
result_schema = "schemas/remember.result.json"
constraints_schema = "schemas/constraints.json"
idempotency = "keyed"
constraint_bindings = { scopes = { parts = [{ pointer = "/scope" }], required = true } }

[[components.main.provides]]
capability = "memory.supersede"
description = "Correct the current memory version."
arguments_schema = "schemas/supersede.arguments.json"
result_schema = "schemas/supersede.result.json"
constraints_schema = "schemas/constraints.json"
idempotency = "keyed"
constraint_bindings = { scopes = { parts = [{ pointer = "/scope" }], required = true } }

[[components.main.provides]]
capability = "memory.forget"
description = "Exclude a memory and its predecessors from retrieval."
arguments_schema = "schemas/forget.arguments.json"
result_schema = "schemas/forget.result.json"
constraints_schema = "schemas/constraints.json"
idempotency = "keyed"
constraint_bindings = { scopes = { parts = [{ pointer = "/scope" }], required = true } }

[[components.main.provides]]
capability = "memory.get"
description = "Read active memories by ID and exact scope."
arguments_schema = "schemas/get.arguments.json"
result_schema = "schemas/get.result.json"
constraints_schema = "schemas/constraints.json"
idempotency = "inherent"
constraint_bindings = { scopes = { parts = [{ pointer = "/scope" }], required = true } }

[[components.main.provides]]
capability = "memory.recall"
description = "Find active memories by exact words and scope. Recall procedures before familiar work and related records before saving a lesson. Use focused task, tool, or workflow terms; try alternate terms or authorized history when matches are empty or irrelevant."
arguments_schema = "schemas/recall.arguments.json"
result_schema = "schemas/recall.result.json"
constraints_schema = "schemas/constraints.json"
idempotency = "inherent"
constraint_bindings = { scopes = { parts = [{ pointer = "/scope" }], required = true } }
