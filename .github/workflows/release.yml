name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # The catalog URLs name the workspace version; the tag must be it.
      - name: Check release tag
        env:
          TAG: ${{ inputs.tag }}
        run: test "$TAG" = "v$(nix-instantiate --eval --strict --expr '(import ./. { }).pluribus.version' | tr -d '\"')"
      - run: nix-build -A release --out-link result
      - run: mkdir release && cp -L result/* release/
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.runner }}
          path: release/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Every target writes identical plugin archives; merge dedupes.
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes release/*
