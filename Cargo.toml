[workspace]
members = [
    "plugins/http",
    "plugins/scheduler",
    "plugins/github",
    "crates/pluribus-core",
    "crates/pluribus-log",
    "crates/pluribus-model",
    "crates/pluribus-paths",
    "crates/pluribus-plugin-bindings",
    "crates/pluribus-plugin-sdk",
    "crates/pluribus-plugin-package",
    "crates/pluribus-host-http",
    "crates/pluribus-host-stream",
    "crates/pluribus-runtime-wasm",
    "crates/pluribus-cognition",
    "crates/pluribus-cli",
    "crates/pluribus-store-fs",
    "crates/pluribus-store-sqlite",
    "plugins/cli",
    "plugins/cli/protocol",
    "plugins/echo",
    "plugins/email",
    "plugins/memory",
    "plugins/openai-codex",
    "plugins/openrouter",
    "plugins/rlm/cognition",
    "plugins/rlm/repl",
    "plugins/shell",
    "plugins/telegram/core",
    "plugins/telegram/receive",
    "plugins/telegram/send",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
version = "1.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
pluribus-plugin-sdk = { path = "crates/pluribus-plugin-sdk" }
async-sqlite = { version = "0.6", default-features = false, features = ["bundled"] }
async-trait = "0.1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
boa_engine = { version = "=0.21.1", default-features = false }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
flate2 = "1.1"
futures-util = { version = "0.3", features = ["io"] }
getrandom = "0.3"
jsonschema = { version = "0.53", default-features = false }
nix = { version = "0.31", default-features = false, features = ["socket", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rpassword = "7.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "net", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
tempfile = "3.23"
tokio = { version = "1.53", features = ["fs", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
url = "2.5"
wasmtime = { version = "48.0.1", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"] }
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc", "async", "async-spawn"] }
wit-component = { version = "0.254", features = ["dummy-module"] }
wit-parser = { version = "0.254", default-features = false, features = ["decoding"] }

wasmtime-wasi-http = { version = "48.0.1", default-features = false, features = ["p3"] }
http = "1"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
webpki-roots = "1.0"
